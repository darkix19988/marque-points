<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Marque-points</title>
  <meta name="description" content="Comptez les points de vos jeux de société, sans calcul ni feuille de score.">
  <meta name="theme-color" content="#0e1420">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/icon-192.png">
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/base.css?v=7">
  <style>
    .hero { padding: 36px 0 22px; position: relative; }
    .theme-btn { position: absolute; top: 16px; right: -6px; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 600; }
    .hero .logo { font-size: 36px; line-height: 1; }
    .hero h1 { font-size: 28px; margin-top: 10px; }
    .hero p { margin-top: 6px; font-size: 16px; }
    .games { display: grid; gap: 14px; padding-bottom: 28px; }
    .group-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin: 0 4px 10px; }
    .game .art.money { background: #12301f; }
    .reload { border: 0; background: none; color: var(--ink-2); text-decoration: underline; font-size: 12px; padding: 8px; }
    .game {
      display: flex; gap: 16px; align-items: center; text-decoration: none;
      padding: 18px; border-radius: var(--radius); background: var(--surface);
      border: 1px solid var(--line); box-shadow: var(--shadow); transition: transform .1s;
    }
    .game:active { transform: scale(.99); }
    .game .art {
      width: 52px; height: 52px; flex: none; border-radius: 14px; display: grid; place-items: center;
      font-size: 28px; background: #121a2a; color: #f2c14e;
    }
    .game h2 { font-size: 20px; }
    .game .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tag { font-size: 12px; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
    .game.soon { opacity: .6; box-shadow: none; pointer-events: none; }
    .game.soon .art { background: var(--surface-2); color: var(--ink-3); }
    .go { margin-left: auto; font-size: 22px; color: var(--ink-3); }
    .resume { display: inline-block; margin-top: 6px; font-size: 13px; color: var(--accent); font-weight: 600; }
    footer { padding: 0 0 32px; text-align: center; }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <button class="theme-btn" id="theme-btn" type="button"></button>
      <div class="logo" aria-hidden="true">🎲</div>
      <h1>Marque-points</h1>
      <p class="muted">Vous saisissez, le site calcule.</p>
    </header>

    <h2 class="group-title">Jeux</h2>
    <section class="games" aria-label="Jeux">
      <a class="game" href="skull-king/">
        <div class="art" aria-hidden="true">☠️</div>
        <div>
          <h2>Skull King</h2>
          <p class="muted small">Annonces, plis et bonus.</p>
          <span class="resume" id="sk-resume" hidden>Une partie est en cours, touchez pour reprendre</span>
        </div>
        <span class="go" aria-hidden="true">›</span>
      </a>
    </section>

    <h2 class="group-title">Outils</h2>
    <section class="games" aria-label="Outils">
      <a class="game" href="depenses/">
        <div class="art money" aria-hidden="true">💸</div>
        <div>
          <h2>Dépenses</h2>
          <p class="muted small">Qui doit combien à qui.</p>
          <span class="resume" id="dep-info" hidden></span>
        </div>
        <span class="go" aria-hidden="true">›</span>
      </a>
    </section>
  </main>
  <footer class="wrap muted tiny">Tout est enregistré sur cet appareil, rien n’est envoyé en ligne.<br><button class="reload" type="button" onclick="mpReload()">Recharger l’application</button></footer>
  <script>
    try {
      const sk = JSON.parse(localStorage.getItem('marque-points:skull-king:v1') || 'null');
      if (sk && sk.current && !sk.current.finished) document.getElementById('sk-resume').hidden = false;
    } catch (e) { /* stockage indisponible */ }
    const tb = document.getElementById('theme-btn');
    const showTheme = () => { tb.textContent = `${mpTheme.icon()} ${mpTheme.label()}`; tb.setAttribute('aria-label', `Thème : ${mpTheme.label()}, toucher pour changer`); };
    tb.addEventListener('click', () => { mpTheme.cycle(); showTheme(); });
    showTheme();
    try {
      const dep = JSON.parse(localStorage.getItem('marque-points:depenses:v1') || 'null');
      const n = dep && dep.groups ? dep.groups.length : 0;
      if (n) { const el = document.getElementById('dep-info'); el.textContent = `${n} groupe${n > 1 ? 's' : ''} enregistré${n > 1 ? 's' : ''}`; el.hidden = false; }
    } catch (e) { /* stockage indisponible */ }
  </script>
  <script src="assets/js/update.js" data-version="7" data-root="./" defer></script>
</body>
</html>
